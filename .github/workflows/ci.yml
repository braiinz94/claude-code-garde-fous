name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validation & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Claude Code
        # Version figée : celle sur laquelle les tests ont été écrits et vérifiés.
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: Validate manifests
        run: |
          claude plugin validate .
          for m in masque-secrets garde-envoi journal-audit veille-injection; do
            claude plugin validate "./$m"
          done

      - name: Tests
        run: |
          for m in masque-secrets garde-envoi journal-audit veille-injection; do
            echo "::group::$m"
            claude plugin test "./$m"
            echo "::endgroup::"
          done
